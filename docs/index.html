<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тягай Лёшу за уши!</title>
<style>
html, body { height: 100%; margin: 0; padding: 0; }
body { background: #2b1d4e; color: #ffe066; overflow: hidden; touch-action: none; overscroll-behavior: none; }
#canvas { display: block; margin: 0; border: 0; }
#canvas:focus { outline: none; }
#status { position: absolute; inset: 0; background: #2b1d4e; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; font: 600 20px system-ui, sans-serif; }
#status progress { width: 60%; }
#notice { display: none; max-width: 80%; text-align: center; font-weight: 400; }
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"><style>html,body{touch-action:none;overscroll-behavior:none;}</style>
</head><body>
<canvas id="canvas">Браузер не умеет HTML5 canvas</canvas>
<div id="status"><div>Загружаем Лёшу…</div><progress id="progress"></progress><div id="notice"></div></div>
<script>
// Phones with a 3x screen would render far more pixels than the game needs.
(function () {
	const real = window.devicePixelRatio || 1;
	try {
		Object.defineProperty(window, 'devicePixelRatio', { configurable: true, get: function () {
			const longSide = Math.max(innerWidth, innerHeight) || 1;
			return Math.max(1, Math.min(real, 3, 1920 / longSide));
		} });
	} catch (e) {}
}());
</script>
<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":8319984,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);
(function () {
	const status = document.getElementById('status');
	const progress = document.getElementById('progress');
	const notice = document.getElementById('notice');
	function fail(err) {
		notice.textContent = err instanceof Error ? err.message : String(err);
		notice.style.display = 'block';
		progress.style.display = 'none';
	}
	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length) { fail('Браузер не умеет: ' + missing.join(', ')); return; }
	engine.startGame({
		onProgress: function (cur, total) {
			if (cur > 0 && total > 0) { progress.value = cur; progress.max = total; }
		},
	}).then(function () { status.remove(); }, fail);
}());
</script>
</body></html>
